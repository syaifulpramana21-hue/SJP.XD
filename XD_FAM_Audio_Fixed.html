<script>
const c=document.getElementById('mx'),x=c.getContext('2d');
function rs(){c.width=innerWidth;c.height=innerHeight;}rs();onresize=rs;
const chars="01ABCDEFGHIJKLMNOPQRSTUVWXYZ",fs=16,d=Array(Math.floor(innerWidth/fs)).fill(1);
(function loop(){x.fillStyle="rgba(0,0,0,.08)";x.fillRect(0,0,c.width,c.height);x.fillStyle="#00ff66";x.font=fs+"px monospace";
for(let i=0;i<d.length;i++){let t=chars[Math.random()*chars.length|0];x.fillText(t,i*fs,d[i]*fs);if(d[i]*fs>c.height&&Math.random()>.98)d[i]=0;d[i]++;}requestAnimationFrame(loop)})();
unlock.onclick=async()=>{
const a=document.getElementById('unlockAudio');
a.loop=true;a.currentTime=0;try{await a.play();}catch(e){console.log(e);}
title.textContent="AUTHENTICATING...";
const lines=["[OK] Initializing...","[OK] Verifying...","[OK] Loading modules...","[OK] Root access granted.","[OK] SYSTEM ONLINE"];
log.textContent="";
let i=0;const iv=setInterval(()=>{log.textContent+=lines[i]+"\n";i++;if(i>=lines.length){clearInterval(iv);title.textContent="SYSTEM ONLINE";}},700);
};
exit.onclick=()=>{
warn.style.display="block";
flash.classList.add("flash");
const ac=new(window.AudioContext||window.webkitAudioContext)();
setInterval(()=>{const o=ac.createOscillator(),g=ac.createGain();o.type="square";o.frequency.value=700+Math.random()*500;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.08);},140);
};
</script>
